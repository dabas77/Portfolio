DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vansh & Priyanshu | Creative Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
      scroll-behavior: smooth;
    }

    body {
      background: radial-gradient(circle at 20% 20%, #0d1117, #05070a);
      color: #f0f6fc;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Ambient background glows */
    .glow-spot {
      position: fixed;
      width: 450px;
      height: 450px;
      border-radius: 50%;
      filter: blur(120px);
      z-index: -1;
      opacity: 0.15;
      pointer-events: none;
    }
    .glow-1 { top: -50px; left: -100px; background: #00f0ff; }
    .glow-2 { bottom: 50px; right: -50px; background: #a855f7; }

    /* Sticky Navigation */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 8%;
      background: rgba(13, 17, 23, 0.7);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #00f0ff, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .nav-links a {
      color: #8b949e;
      text-decoration: none;
      margin-left: 20px;
      transition: color 0.3s;
      font-weight: 500;
    }
    .nav-links a:hover {
      color: #00f0ff;
    }

    /* Hero & Profile Section */
    .hero {
      padding: 60px 8% 40px;
      text-align: center;
    }
    .hero h1 {
      font-size: 2.8rem;
      font-weight: 800;
      margin-bottom: 15px;
    }
    .hero h1 span {
      background: linear-gradient(90deg, #00f0ff, #7928ca);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hero p {
      color: #8b949e;
      font-size: 1.1rem;
      max-width: 600px;
      margin: 0 auto 40px;
    }

    /* 3D Tilt Cards Container */
    .cards-container {
      display: flex;
      justify-content: center;
      gap: 40px;
      flex-wrap: wrap;
      perspective: 1000px;
      margin-bottom: 50px;
    }

    .tilt-card {
      width: 330px;
      background: rgba(22, 27, 34, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 30px 20px;
      text-align: center;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.1s ease, box-shadow 0.3s ease;
      cursor: pointer;
    }
    .tilt-card:hover {
      box-shadow: 0 15px 35px rgba(0, 240, 255, 0.2);
      border-color: rgba(0, 240, 255, 0.4);
    }
    .profile-img-container {
      width: 110px;
      height: 110px;
      margin: 0 auto 20px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, #00f0ff, #a855f7);
      transform: translateZ(30px);
    }
    .profile-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background: #161b22;
    }
    .tilt-card h2 {
      font-size: 1.45rem;
      margin-bottom: 5px;
      transform: translateZ(25px);
    }
    .tilt-card .role {
      color: #00f0ff;
      font-size: 0.95rem;
      margin-bottom: 15px;
      transform: translateZ(20px);
      font-weight: 600;
    }
    .tilt-card .bio {
      color: #8b949e;
      font-size: 0.85rem;
      line-height: 1.5;
      margin-bottom: 20px;
      transform: translateZ(15px);
    }
    .social-tags {
      display: flex;
      justify-content: center;
      gap: 10px;
      transform: translateZ(20px);
      flex-wrap: wrap;
    }
    .tag {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #c9d1d9;
    }

    /* Hero Jump Button */
    .cta-container {
      margin-top: 20px;
    }
    .btn-glow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(90deg, #00f0ff, #7928ca);
      color: #05070a;
      font-weight: 700;
      padding: 14px 32px;
      border-radius: 30px;
      text-decoration: none;
      font-size: 1rem;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
      transition: all 0.3s ease;
      border: none;
      cursor: pointer;
    }
    .btn-glow:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 0 35px rgba(0, 240, 255, 0.7);
      color: #000;
    }

    /* Projects Section */
    .projects-section {
      padding: 80px 8%;
      background: rgba(13, 17, 23, 0.5);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }
    .section-title {
      text-align: center;
      font-size: 2.2rem;
      margin-bottom: 10px;
    }
    .section-desc {
      text-align: center;
      color: #8b949e;
      margin-bottom: 40px;
    }

    .project-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 25px;
    }
    .project-card {
      background: #161b22;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.3s ease;
    }
    .project-card:hover {
      transform: translateY(-6px);
      border-color: #a855f7;
      box-shadow: 0 10px 25px rgba(168, 85, 247, 0.2);
    }
    .badge {
      align-self: flex-start;
      font-size: 0.7rem;
      padding: 4px 10px;
      border-radius: 8px;
      background: rgba(0, 240, 255, 0.1);
      color: #00f0ff;
      margin-bottom: 15px;
      font-weight: 600;
    }
    .project-card h3 {
      font-size: 1.25rem;
      margin-bottom: 10px;
    }
    .project-card p {
      color: #8b949e;
      font-size: 0.85rem;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    /* Animated Action Buttons */
    .card-actions {
      display: flex;
      gap: 12px;
      margin-top: 15px;
    }
    .action-btn {
      flex: 1;
      text-align: center;
      padding: 10px 0;
      border-radius: 10px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      position: relative;
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }

    .btn-primary {
      background: linear-gradient(135deg, #00f0ff, #7928ca);
      color: #05070a;
      box-shadow: 0 4px 15px rgba(0, 240, 255, 0.2);
    }
    .btn-primary:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 8px 25px rgba(0, 240, 255, 0.5);
      color: #000;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: #c9d1d9;
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(5px);
    }

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Portal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: radial-gradient(circle at 50% 20%, #1e1e2f, #0a0a12 80%);
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .header-text {
      text-align: center;
      margin-bottom: 24px;
    }

    .header-text h1 {
      font-size: 1.8rem;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-text p {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-top: 6px;
    }

    .scene {
      width: 100%;
      max-width: 380px;
      height: 520px;
      perspective: 1200px;
    }

    .card-wrap {
      width: 100%;
      height: 100%;
      position: relative;
      transition: transform 0.8s cubic-bezier(0.4, 0.2, 0.2, 1);
      transform-style: preserve-3d;
    }

    .card-wrap.is-flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 20px;
      background: rgba(22, 27, 34, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(14px);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 25px rgba(56, 189, 248, 0.1);
      padding: 28px 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .card-front {
      border-top: 2px solid #38bdf8;
    }

    .card-back {
      transform: rotateY(180deg);
      border-top: 2px solid #a855f7;
    }

    .profile-top {
      text-align: center;
    }

    .avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      font-weight: bold;
      background: #0f172a;
      border: 2px solid rgba(255, 255, 255, 0.15);
    }

    .avatar.cyan { color: #38bdf8; border-color: #38bdf8; }
    .avatar.purple { color: #a855f7; border-color: #a855f7; }

    .name {
      font-size: 1.3rem;
      font-weight: 600;
    }

    .tag {
      display: inline-block;
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      color: #94a3b8;
      margin-top: 6px;
    }

    .files-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 16px 0;
      flex-grow: 1;
      overflow-y: auto;
    }

    .file-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 10px 14px;
      border-radius: 12px;
      text-decoration: none;
      color: #e2e8f0;
      transition: all 0.2s ease;
    }

    .file-item:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateX(4px);
    }

    .file-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .file-icon {
      font-size: 1.2rem;
    }

    .file-name {
      font-size: 0.88rem;
      font-weight: 500;
    }

    .file-badge {
      font-size: 0.7rem;
      color: #64748b;
    }

    .flip-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-cyan {
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      color: #0f172a;
    }

    .btn-purple {
      background: linear-gradient(135deg, #7e22ce, #c084fc);
      color: #0f172a;
    }

    .hint {
      text-align: center;
      font-size: 0.75rem;
      color: #64748b;
      margin-top: 18px;
    }
  </style>
</head>
<body>

    <h1>Student Portal</h1>
    <p>Card ghumane ke liye button dabayein</p>
  </div>

      <div class="card-face card-front">
        <div class="profile-top">
          <div class="avatar cyan">D</div>
          <div class
